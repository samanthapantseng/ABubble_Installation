<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Three.js Gaussian Splats Viewer</title>
    </head>

    <body>
        <div id="ui">
            <label>
                Load Scene
                <input id="plyInput" type="file" accept=".ply,.splat,.ksplat" />
            </label>
            <label>
                URL
                <input id="plyUrl" type="text" value="data/bubble.ksplat" />
            </label>
            <button id="loadUrl" type="button">Load URL</button>
            <button id="resetView" type="button">Reset View</button>
            <button
                id="helpToggle"
                type="button"
                aria-expanded="false"
                aria-controls="helpPanel"
            >
                ?
            </button>
            <span id="status">No file loaded</span>
        </div>
        <div id="helpPanel" hidden>
            <h4>Keyboard input</h4>
            <ul>
                <li><strong>I</strong>: Display debug info panel</li>
                <li><strong>H</strong>: Hide or show all menus</li>
                <li><strong>X</strong>: Toggle circular projection mask</li>
            </ul>
        </div>
        <div id="app"></div>

        <!-- Debug readout of the OSC /trigger state. Starts hidden and is
             shown with the other menus by the H key, same as #helpPanel. -->
        <div id="triggerDebug" hidden>Trigger: — (no OSC yet)</div>

        <script src="https://cdn.jsdelivr.net/npm/osc/dist/osc-browser.min.js"></script>
        <script>
            const oscPort = new osc.WebSocketPort({
                url: "ws://localhost:3000",
                metadata: true,
            });
            oscPort.open();

            window.__pulley = { value: -10 };
            // buoyData.pd's "toggle journey" toggle sends /trigger 1 to start the
            // descent (glide to bottom) and /trigger 0 to return to the surface,
            // on port 7000 alongside /pulley. active === true means descending.
            // value stays null until a /trigger actually arrives, so the debug
            // readout can tell "never received" apart from "received a 0".
            window.__pulleyTrigger = { active: false, value: null };

            oscPort.on("message", (oscMsg) => {
                if (oscMsg.address === "/pulley") {
                    const value = oscMsg.args?.[0]?.value;
                    if (Number.isFinite(value)) {
                        window.__pulley.value = value;
                    }
                } else if (oscMsg.address === "/trigger") {
                    const value = oscMsg.args?.[0]?.value;
                    if (Number.isFinite(value)) {
                        window.__pulleyTrigger.value = value;
                        window.__pulleyTrigger.active = value >= 0.5;
                    }
                }
            });
        </script>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
